<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Restaurante - EasyFood</title>
</head>

<body data-pagina="inicio">

    <main class="app-main">

        <section class="panel rest-hero">

            <div class="synth" aria-hidden="true">
                <div class="synth-sun"></div>
                <div class="synth-floor"></div>
            </div>

            <div class="rest-hero-body">
                <div class="rest-hero-photo thumb" id="fotoRestaurante"></div>

                <div>
                    <a class="kicker" href="/">restaurantes</a>
                    <h1 id="nomeRestaurante">Carregando...</h1>
                    <div class="rest-hero-meta" id="infoRestaurante"></div>
                </div>
            </div>

        </section>

        <p id="avisoFechado" class="closed-bar" hidden></p>

        <div class="store">

            <!-- Cardápio -->
            <div id="cardapio">
                <p class="empty">Carregando cardápio...</p>
            </div>

            <!-- Carrinho -->
            <aside class="panel cart" aria-label="Seu pedido">

                <div class="panel-title">
                    <h2>Seu pedido</h2>
                    <small id="qtdItens">0 itens</small>
                </div>

                <div id="carrinho" class="cart-lines"></div>

                <label class="field" id="campoSalvos" hidden>
                    <span>Endereços salvos</span>
                    <select id="enderecosSalvos"></select>
                </label>

                <label class="field">
                    <span>Endereço de entrega</span>
                    <input id="endereco" type="text" maxlength="200" placeholder="Rua, número, bairro" autocomplete="street-address">
                </label>

                <label class="check" id="linhaSalvarEndereco" hidden>
                    <input type="checkbox" id="salvarEndereco">
                    Salvar na minha conta
                </label>

                <label class="field">
                    <span>Observação</span>
                    <input id="observacao" type="text" maxlength="200" placeholder="Sem cebola, interfone 12...">
                </label>

                <fieldset>
                    <legend>Pagamento na entrega</legend>
                    <div class="options">
                        <label><input type="radio" name="pagamento" value="PIX" checked> Pix</label>
                        <label><input type="radio" name="pagamento" value="CARTAO"> Cartão</label>
                        <label><input type="radio" name="pagamento" value="DINHEIRO"> Dinheiro</label>
                    </div>
                </fieldset>

                <label class="field" id="campoTroco" hidden>
                    <span>Troco para quanto?</span>
                    <input id="troco" type="number" min="0" step="0.01" placeholder="Ex.: 100">
                </label>

                <div class="summary">
                    <div><span>Subtotal</span><span class="preco" id="subtotal">R$ 0,00</span></div>
                    <div><span>Entrega</span><span class="preco" id="taxa">R$ 0,00</span></div>
                    <div class="total"><span>Total</span><span class="preco" id="total">R$ 0,00</span></div>
                    <p id="avisoMinimo" class="min-warning" hidden></p>
                </div>

                <button id="btnFinalizar" class="btn btn-neon btn-lg btn-block" onclick="finalizarPedido()">
                    Finalizar pedido
                </button>

            </aside>

        </div>

        <div class="section-title">
            <h2>Avaliações</h2>
            <p id="resumoAvaliacoes"></p>
        </div>

        <div id="avaliacoes" class="reviews">
            <p class="empty">Carregando avaliações...</p>
        </div>

    </main>

    <script src="/js/app.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/imagens.js"></script>
    <script src="/js/shell.js"></script>

    <script>

        const { escapar, preco } = App;

        const restauranteId = Number(
            new URLSearchParams(window.location.search).get("id")
        );

        // O carrinho fica salvo por restaurante, no navegador
        const CHAVE_CARRINHO = `easyfood:carrinho:${restauranteId}`;
        const CHAVE_ENDERECO = "easyfood:endereco";
        const CHAVE_OBSERVACAO = `easyfood:observacao:${restauranteId}`;

        let restaurante = null;
        let cardapio = [];
        let carrinho = lerCarrinho();
        let enderecosSalvos = [];

        const campoEndereco = document.getElementById("endereco");
        const campoObservacao = document.getElementById("observacao");


        // ---------- Restaurante e cardápio ----------

        async function carregarRestaurante() {

            try {

                restaurante = await App.api(`/restaurants/${restauranteId}`);

            } catch (erro) {

                document.getElementById("nomeRestaurante").textContent = "Restaurante não encontrado";
                document.getElementById("cardapio").innerHTML =
                    `<p class="empty"><span class="crt">404</span>${escapar(erro.message)} <a href="/">Voltar ao início</a></p>`;
                return;

            }

            document.title = `${restaurante.name} - EasyFood`;
            document.getElementById("nomeRestaurante").textContent = restaurante.name;

            const foto = document.getElementById("fotoRestaurante");
            const emoji = App.emoji(restaurante.category);

            foto.innerHTML = restaurante.imageUrl
                ? `<img src="${escapar(restaurante.imageUrl)}" alt="" data-emoji="${emoji}">`
                : `<span class="photo-empty">${emoji}</span>`;

            mostrarInfo();

            cardapio = restaurante.dishes;

            sincronizarCarrinho();
            mostrarCardapio();
            atualizarCarrinho();

        }

        function mostrarInfo() {

            const partes = [
                escapar(restaurante.category),
                `<span class="rating">${App.notaResumo(restaurante)}</span>`,
                restaurante.deliveryFee > 0 ? `Entrega ${preco(restaurante.deliveryFee)}` : "Entrega grátis"
            ];

            if (restaurante.minOrder > 0) {
                partes.push(`Mínimo ${preco(restaurante.minOrder)}`);
            }

            if (restaurante.opensAt) {
                partes.push(`${restaurante.opensAt}–${restaurante.closesAt}`);
            }

            partes.push(restaurante.isOpen
                ? `<span class="badge badge-live">Aberto</span>`
                : `<span class="badge badge-off">Fechado</span>`);

            document.getElementById("infoRestaurante").innerHTML = partes.join("<span>/</span>");

            const aviso = document.getElementById("avisoFechado");
            aviso.hidden = restaurante.isOpen;
            aviso.textContent = `Fechado agora. Abre às ${restaurante.opensAt}. Você pode montar o carrinho e pedir quando abrir.`;

        }

        function cartaoPrato(prato) {

            const emoji = App.emoji(prato.category, restaurante.category);

            return `
<article class="panel dish ${prato.available ? "" : "esgotado"}">
    <div class="dish-photo thumb">
        ${prato.imageUrl
            ? `<img src="${escapar(prato.imageUrl)}" alt="${escapar(prato.name)}" loading="lazy" data-emoji="${emoji}">`
            : `<span class="photo-empty">${emoji}</span>`}
    </div>

    <div class="dish-body">
        <h3>${escapar(prato.name)}</h3>
        ${prato.description ? `<p>${escapar(prato.description)}</p>` : ""}
    </div>

    <div class="dish-foot">
        <span class="preco">${preco(prato.price)}</span>
        ${prato.available
            ? `<button class="btn btn-cyan btn-sm" onclick="adicionarAoCarrinho(${prato.id})">+ Adicionar</button>`
            : `<span class="badge badge-off">Esgotado</span>`}
    </div>
</article>`;

        }

        function mostrarCardapio() {

            const container = document.getElementById("cardapio");

            if (cardapio.length === 0) {
                container.innerHTML = `<p class="empty">Este restaurante ainda não cadastrou pratos.</p>`;
                return;
            }

            // Agrupa por categoria do prato
            const grupos = {};

            cardapio.forEach(prato => {
                (grupos[prato.category] ||= []).push(prato);
            });

            container.innerHTML = Object.entries(grupos).map(([categoria, pratos]) => `
<section class="menu-group">
    <h2>${App.emoji(categoria, restaurante.category)} ${escapar(categoria)}</h2>
    <div class="dish-grid">${pratos.map(cartaoPrato).join("")}</div>
</section>`).join("");

        }


        // ---------- Carrinho ----------

        function lerCarrinho() {
            try {
                return JSON.parse(localStorage.getItem(CHAVE_CARRINHO)) || [];
            } catch {
                return [];
            }
        }

        function salvarCarrinho() {
            if (carrinho.length) {
                localStorage.setItem(CHAVE_CARRINHO, JSON.stringify(carrinho));
            } else {
                localStorage.removeItem(CHAVE_CARRINHO);
            }
        }

        // Ao abrir a página, tira pratos excluídos ou esgotados e atualiza nome e preço
        function sincronizarCarrinho() {

            const removidos = [];

            carrinho = carrinho.filter(item => {
                const prato = cardapio.find(p => p.id === item.id);

                if (!prato || !prato.available) {
                    removidos.push(item.nome);
                    return false;
                }

                item.nome = prato.name;
                item.preco = prato.price;
                return true;
            });

            salvarCarrinho();

            if (removidos.length) {
                UI.info(`Saíram do carrinho por estarem indisponíveis: ${removidos.join(", ")}.`);
            }

        }

        function adicionarAoCarrinho(id) {

            const prato = cardapio.find(p => p.id === id);

            if (!prato || !prato.available) return;

            const item = carrinho.find(i => i.id === id);

            if (item) {
                item.quantidade = Math.min(item.quantidade + 1, 50);
            } else {
                carrinho.push({ id, nome: prato.name, preco: prato.price, quantidade: 1 });
            }

            atualizarCarrinho();

        }

        function alterarQuantidade(id, valor) {

            const item = carrinho.find(i => i.id === id);

            if (!item) return;

            item.quantidade = Math.min(item.quantidade + valor, 50);

            if (item.quantidade <= 0) {
                carrinho = carrinho.filter(i => i.id !== id);
            }

            atualizarCarrinho();

        }

        function removerDoCarrinho(id) {
            carrinho = carrinho.filter(i => i.id !== id);
            atualizarCarrinho();
        }

        function atualizarCarrinho() {

            salvarCarrinho();

            const quantidade = carrinho.reduce((soma, item) => soma + item.quantidade, 0);

            document.getElementById("qtdItens").textContent =
                `${quantidade} ${quantidade === 1 ? "item" : "itens"}`;

            document.getElementById("carrinho").innerHTML = carrinho.length === 0
                ? `<p class="cart-empty">Carrinho vazio. Adicione pratos do cardápio.</p>`
                : carrinho.map(item => `
<div class="cart-line">
    <h4>${escapar(item.nome)}</h4>
    <span class="preco">${preco(item.preco * item.quantidade)}</span>
    <div class="cart-line-actions">
        <div class="qty">
            <button onclick="alterarQuantidade(${item.id}, -1)" aria-label="Diminuir">−</button>
            <span>${item.quantidade}</span>
            <button onclick="alterarQuantidade(${item.id}, 1)" aria-label="Aumentar">+</button>
        </div>
        <button class="link-remove" onclick="removerDoCarrinho(${item.id})">remover</button>
    </div>
</div>`).join("");

            const subtotal = carrinho.reduce((soma, item) => soma + item.preco * item.quantidade, 0);
            const taxa = restaurante && carrinho.length ? restaurante.deliveryFee : 0;
            const minimo = restaurante ? restaurante.minOrder : 0;
            const faltaMinimo = carrinho.length > 0 && subtotal < minimo;

            document.getElementById("subtotal").textContent = preco(subtotal);
            document.getElementById("taxa").textContent = taxa > 0 ? preco(taxa) : "Grátis";
            document.getElementById("total").textContent = preco(subtotal + taxa);

            const avisoMinimo = document.getElementById("avisoMinimo");
            avisoMinimo.hidden = !faltaMinimo;
            avisoMinimo.textContent = `Faltam ${preco(minimo - subtotal)} para o pedido mínimo de ${preco(minimo)}.`;

            document.getElementById("btnFinalizar").disabled =
                carrinho.length === 0 || faltaMinimo || (restaurante && !restaurante.isOpen);

        }


        // ---------- Pagamento ----------

        function formaPagamento() {
            return document.querySelector("input[name=pagamento]:checked").value;
        }

        document.querySelectorAll("input[name=pagamento]").forEach(opcao => {
            opcao.addEventListener("change", () => {
                document.getElementById("campoTroco").hidden = formaPagamento() !== "DINHEIRO";
            });
        });


        // ---------- Endereço ----------

        campoEndereco.value = localStorage.getItem(CHAVE_ENDERECO) || "";
        campoObservacao.value = sessionStorage.getItem(CHAVE_OBSERVACAO) || "";

        // Guarda o que foi digitado (não se perde se precisar fazer login antes)
        campoEndereco.addEventListener("input", () => {
            localStorage.setItem(CHAVE_ENDERECO, campoEndereco.value);
        });

        campoObservacao.addEventListener("input", () => {
            sessionStorage.setItem(CHAVE_OBSERVACAO, campoObservacao.value);
        });

        async function carregarEnderecosSalvos() {

            if (!App.logado()) return;

            try {
                enderecosSalvos = await App.api("/auth/me/addresses", { autenticado: true, seExpirar: "limpar" });
            } catch {
                return;
            }

            document.getElementById("linhaSalvarEndereco").hidden = false;

            if (enderecosSalvos.length === 0) return;

            const select = document.getElementById("enderecosSalvos");

            select.innerHTML = `<option value="">Escolher...</option>` +
                enderecosSalvos.map(e => `<option value="${e.id}">${escapar(e.label)}: ${escapar(e.street)}</option>`).join("");

            document.getElementById("campoSalvos").hidden = false;

            select.addEventListener("change", () => {
                const escolhido = enderecosSalvos.find(e => String(e.id) === select.value);

                if (escolhido) {
                    campoEndereco.value = escolhido.street;
                    localStorage.setItem(CHAVE_ENDERECO, escolhido.street);
                }
            });

        }

        async function salvarEnderecoNaConta(endereco) {

            if (enderecosSalvos.some(e => e.street === endereco)) return;

            try {
                await App.api("/auth/me/addresses", {
                    method: "POST",
                    autenticado: true,
                    body: { label: `Endereço ${enderecosSalvos.length + 1}`, street: endereco }
                });
            } catch {
                // o pedido já foi feito; salvar o endereço é só um extra
            }

        }


        // ---------- Finalizar ----------

        async function finalizarPedido() {

            if (carrinho.length === 0) {
                UI.erro("Adicione pelo menos um prato ao pedido.");
                return;
            }

            const endereco = campoEndereco.value.trim();

            if (endereco.length < 5) {
                UI.erro("Informe o endereço de entrega.");
                campoEndereco.focus();
                return;
            }

            // Sem login: o carrinho já está salvo; entra e volta para cá
            if (!App.exigirLogin()) return;

            const botao = document.getElementById("btnFinalizar");
            botao.disabled = true;

            try {

                const pedido = await App.api("/orders", {
                    method: "POST",
                    autenticado: true,
                    body: {
                        address: endereco,
                        note: campoObservacao.value.trim(),
                        paymentMethod: formaPagamento(),
                        changeFor: formaPagamento() === "DINHEIRO" ? document.getElementById("troco").value : undefined,
                        items: carrinho.map(item => ({ dishId: item.id, quantity: item.quantidade }))
                    }
                });

                localStorage.setItem(CHAVE_ENDERECO, endereco);

                if (document.getElementById("salvarEndereco").checked) {
                    await salvarEnderecoNaConta(endereco);
                }

                carrinho = [];
                salvarCarrinho();
                sessionStorage.removeItem(CHAVE_OBSERVACAO);

                UI.avisoNaProximaPagina(`Pedido #${pedido.id} enviado!`);
                window.location.href = `/pedidos.html?novo=${pedido.id}`;

            } catch (erro) {

                UI.erro(erro);

                // Algum prato esgotou enquanto a pessoa montava o pedido
                if (erro.status === 409) {
                    await carregarRestaurante();
                }

                botao.disabled = carrinho.length === 0;

            }

        }


        // ---------- Avaliações ----------

        async function carregarAvaliacoes() {

            const container = document.getElementById("avaliacoes");

            try {

                const avaliacoes = await App.api(`/restaurants/${restauranteId}/reviews`);

                document.getElementById("resumoAvaliacoes").textContent =
                    avaliacoes.length ? `${avaliacoes.length} ${avaliacoes.length === 1 ? "avaliação" : "avaliações"}` : "";

                container.innerHTML = avaliacoes.length === 0
                    ? `<p class="empty">Ainda sem avaliações. Peça e seja o primeiro a avaliar.</p>`
                    : avaliacoes.map(a => `
<article class="panel review">
    <div class="review-head">
        <strong>${escapar(a.user.name)}</strong>
        <span class="stars" aria-label="${a.rating} de 5 estrelas">${App.estrelas(a.rating)}</span>
    </div>
    ${a.comment ? `<p>${escapar(a.comment)}</p>` : ""}
    <small>${App.data(a.createdAt)}</small>
</article>`).join("");

            } catch {
                container.innerHTML = "";
            }

        }


        carregarRestaurante();
        carregarEnderecosSalvos();
        carregarAvaliacoes();

    </script>

</body>

</html>
