<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Nova senha - EasyFood</title>
</head>

<body>

    <main class="auth">

        <section class="auth-art" aria-hidden="true">
            <div class="synth">
                <div class="synth-sun"></div>
                <div class="synth-floor"></div>
            </div>
            <a class="auth-brand" href="/">Easy<span>Food</span></a>
            <h2>Nova senha, novo acesso.</h2>
        </section>

        <section class="auth-form-side">

            <div class="auth-box">

                <span class="kicker">recuperar acesso</span>
                <h1>Nova senha</h1>
                <p>Escolha uma senha com pelo menos 6 caracteres.</p>

                <p id="mensagem" class="auth-message" hidden></p>

                <form id="formRedefinir" class="stack">

                    <label class="field">
                        <span>Nova senha</span>
                        <input type="password" id="password" minlength="6" autocomplete="new-password" required>
                    </label>

                    <label class="field">
                        <span>Repita a nova senha</span>
                        <input type="password" id="password2" minlength="6" autocomplete="new-password" required>
                    </label>

                    <button type="submit" class="btn btn-neon btn-lg btn-block">Salvar nova senha</button>

                </form>

                <p class="auth-alt">Lembrou a senha? <a href="login.html">Entrar</a></p>

            </div>

        </section>

    </main>

    <script src="/js/app.js"></script>

    <script>

        const mensagem = document.getElementById("mensagem");
        const token = new URLSearchParams(window.location.search).get("token");

        function mostrarErro(texto) {
            mensagem.textContent = texto;
            mensagem.classList.add("erro");
            mensagem.hidden = false;
        }

        if (!token) {
            mostrarErro("Link inválido. Peça um novo em \"Esqueci minha senha\".");
        }

        document.getElementById("formRedefinir").addEventListener("submit", async event => {

            event.preventDefault();

            const password = document.getElementById("password").value;

            if (password !== document.getElementById("password2").value) {
                return mostrarErro("As senhas não são iguais.");
            }

            const botao = event.target.querySelector("button");
            botao.disabled = true;

            try {

                await App.api("/auth/reset-password", {
                    method: "POST",
                    body: { token, password }
                });

                App.limparSessao();
                window.location.href = "/login.html?motivo=senha";

            } catch (erro) {

                mostrarErro(erro.message);
                botao.disabled = false;

            }

        });

    </script>

</body>

</html>
