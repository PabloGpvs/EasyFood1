<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova senha - EasyFood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                EasyFood<span>.</span>
            </div>

            <span class="auth-tag">RECUPERAR ACESSO</span>

            <h1>Criar nova senha</h1>

            <p class="auth-description">
                Escolha uma nova senha com pelo menos 6 caracteres.
            </p>

            <p id="mensagem" class="auth-message" hidden></p>

            <form id="formRedefinir">

                <div class="auth-field">
                    <label for="password">Nova senha</label>
                    <input type="password" id="password" placeholder="Nova senha" minlength="6" required>
                </div>

                <div class="auth-field">
                    <label for="password2">Repita a nova senha</label>
                    <input type="password" id="password2" placeholder="Repita a senha" minlength="6" required>
                </div>

                <button type="submit" class="auth-button">
                    Salvar nova senha
                    <span>→</span>
                </button>

            </form>

            <p class="auth-register">
                Lembrou a senha?
                <a href="login.html">Entrar</a>
            </p>

        </div>

    </main>

    <script src="/js/app.js"></script>

    <script>

        const mensagem = document.getElementById("mensagem");
        const token = new URLSearchParams(window.location.search).get("token");

        function mostrarErro(texto) {
            mensagem.textContent = texto;
            mensagem.classList.add("erro");
            mensagem.hidden = false;
        }

        if (!token) {
            mostrarErro("Link inválido. Peça um novo em \"Esqueci minha senha\".");
        }

        document.getElementById("formRedefinir").addEventListener("submit", async event => {

            event.preventDefault();

            const password = document.getElementById("password").value;

            if (password !== document.getElementById("password2").value) {
                return mostrarErro("As senhas não são iguais.");
            }

            const botao = event.target.querySelector("button");
            botao.disabled = true;

            try {

                await App.api("/auth/reset-password", {
                    method: "POST",
                    body: { token, password }
                });

                App.limparSessao();
                window.location.href = "/login.html?motivo=senha";

            } catch (erro) {

                mostrarErro(erro.message);
                botao.disabled = false;

            }

        });

    </script>

</body>

</html>
