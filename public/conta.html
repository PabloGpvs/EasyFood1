<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Minha conta - EasyFood</title>
</head>

<body data-pagina="conta">

    <main class="app-main" id="conteudo" hidden>

        <header class="page-head">
            <div>
                <span class="kicker">perfil do usuário</span>
                <h1>Minha conta</h1>
                <p class="page-sub">Seus dados, senha, endereços e tipo de conta.</p>
            </div>
        </header>

        <div class="conta-grid">

            <!-- Perfil -->
            <section class="panel stack">

                <div class="panel-title"><h2>Perfil</h2></div>

                <div class="profile">
                    <div class="profile-photo" id="foto"></div>
                    <div class="row">
                        <button type="button" class="btn btn-cyan btn-sm" id="btnFoto">📷 Foto</button>
                        <button type="button" class="btn btn-sm" id="btnRemoverFoto" hidden>Remover foto</button>
                    </div>
                </div>

                <form id="formPerfil" class="stack">
                    <label class="field"><span>Nome</span><input id="nome" type="text" minlength="2" maxlength="80" required></label>
                    <label class="field"><span>E-mail</span><input id="email" type="email" disabled title="O e-mail não pode ser alterado"></label>
                    <button type="submit" class="btn btn-neon">Salvar nome</button>
                </form>

            </section>

            <!-- Senha -->
            <section class="panel">

                <div class="panel-title"><h2>Trocar senha</h2></div>

                <form id="formSenha" class="stack">
                    <label class="field"><span>Senha atual</span><input id="senhaAtual" type="password" autocomplete="current-password" required></label>
                    <label class="field"><span>Nova senha</span><input id="senhaNova" type="password" minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required></label>
                    <label class="field"><span>Repita a nova senha</span><input id="senhaNova2" type="password" minlength="6" autocomplete="new-password" required></label>
                    <button type="submit" class="btn btn-neon">Trocar senha</button>
                </form>

            </section>

            <!-- Endereços -->
            <section class="panel stack">

                <div class="panel-title">
                    <h2>Endereços salvos</h2>
                    <small>aparecem no checkout</small>
                </div>

                <div id="enderecos" class="stack"></div>

                <form id="formEndereco" class="stack">
                    <label class="field"><span>Nome do endereço</span><input id="apelido" type="text" placeholder="Casa, Trabalho..." maxlength="30" required></label>
                    <label class="field"><span>Endereço</span><input id="rua" type="text" placeholder="Rua, número, bairro e complemento" maxlength="200" required></label>
                    <button type="submit" class="btn btn-cyan">Adicionar endereço</button>
                </form>

            </section>

            <!-- Tipo de conta -->
            <section class="panel stack" id="tipoConta"></section>

        </div>

    </main>

    <script src="/js/app.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/imagens.js"></script>
    <script src="/js/shell.js"></script>

    <script>

        const { escapar } = App;
        let usuario = null;


        // ---------- Perfil ----------

        function mostrarPerfil() {

            document.getElementById("foto").innerHTML = usuario.imageUrl
                ? `<img src="${escapar(usuario.imageUrl)}" alt="Sua foto">`
                : `<span class="photo-empty">${escapar(usuario.name.charAt(0).toUpperCase())}</span>`;

            document.getElementById("nome").value = usuario.name;
            document.getElementById("email").value = usuario.email;
            document.getElementById("btnFoto").textContent = usuario.imageUrl ? "📷 Trocar foto" : "📷 Enviar foto";
            document.getElementById("btnRemoverFoto").hidden = !usuario.imageUrl;

            // Mantém nome, foto e tipo de conta da barra lateral em dia
            App.salvarSessao(App.token(), usuario);
            Shell.redesenhar();

            mostrarTipoConta();

        }

        document.getElementById("formPerfil").addEventListener("submit", async evento => {

            evento.preventDefault();

            try {
                usuario = await App.api("/auth/me", {
                    method: "PATCH",
                    autenticado: true,
                    body: { name: document.getElementById("nome").value }
                });
                mostrarPerfil();
                UI.sucesso("Nome atualizado.");
            } catch (erro) {
                UI.erro(erro);
            }

        });

        document.getElementById("btnFoto").addEventListener("click", async evento => {

            const arquivo = await Imagens.escolherArquivo();

            if (!arquivo) return;

            const botao = evento.target;
            botao.disabled = true;

            try {
                usuario = await Imagens.enviar("/auth/me/image", arquivo);
                mostrarPerfil();
                UI.sucesso("Foto atualizada.");
            } catch (erro) {
                UI.erro(erro);
            } finally {
                botao.disabled = false;
            }

        });

        document.getElementById("btnRemoverFoto").addEventListener("click", async () => {

            if (!(await UI.confirmar("Remover sua foto de perfil?", { confirmar: "Remover", perigo: true }))) return;

            try {
                usuario = await Imagens.remover("/auth/me/image");
                mostrarPerfil();
            } catch (erro) {
                UI.erro(erro);
            }

        });


        // ---------- Senha ----------

        document.getElementById("formSenha").addEventListener("submit", async evento => {

            evento.preventDefault();

            const nova = document.getElementById("senhaNova").value;

            if (nova !== document.getElementById("senhaNova2").value) {
                return UI.erro("As senhas novas não são iguais.");
            }

            try {
                await App.api("/auth/me/password", {
                    method: "PUT",
                    autenticado: true,
                    body: {
                        currentPassword: document.getElementById("senhaAtual").value,
                        newPassword: nova
                    }
                });
                evento.target.reset();
                UI.sucesso("Senha alterada.");
            } catch (erro) {
                UI.erro(erro);
            }

        });


        // ---------- Endereços ----------

        async function carregarEnderecos() {

            const enderecos = await App.api("/auth/me/addresses", { autenticado: true });

            document.getElementById("enderecos").innerHTML = enderecos.length === 0
                ? `<p class="hint">Nenhum endereço salvo.</p>`
                : enderecos.map(endereco => `
<div class="address">
    <div>
        <strong>${escapar(endereco.label)}</strong>
        <span>${escapar(endereco.street)}</span>
    </div>
    <button class="btn btn-danger btn-sm" onclick="removerEndereco(${endereco.id})">Remover</button>
</div>`).join("");

        }

        async function removerEndereco(id) {

            if (!(await UI.confirmar("Remover este endereço?", { confirmar: "Remover", perigo: true }))) return;

            try {
                await App.api(`/auth/me/addresses/${id}`, { method: "DELETE", autenticado: true });
                await carregarEnderecos();
            } catch (erro) {
                UI.erro(erro);
            }

        }

        document.getElementById("formEndereco").addEventListener("submit", async evento => {

            evento.preventDefault();

            try {
                await App.api("/auth/me/addresses", {
                    method: "POST",
                    autenticado: true,
                    body: {
                        label: document.getElementById("apelido").value,
                        street: document.getElementById("rua").value
                    }
                });
                evento.target.reset();
                await carregarEnderecos();
                UI.sucesso("Endereço salvo.");
            } catch (erro) {
                UI.erro(erro);
            }

        });


        // ---------- Tipo de conta ----------

        function mostrarTipoConta() {

            const box = document.getElementById("tipoConta");

            if (usuario.role === "ADMIN") {
                box.innerHTML = `
<div class="panel-title"><h2>Administração</h2><span class="badge badge-live">Admin</span></div>
<p>Sua conta é dona da plataforma: gerencia todos os restaurantes, cardápios e pedidos do EasyFood.</p>
<div class="row">
    <a class="btn btn-neon" href="/painel.html">Abrir painel</a>
    <a class="btn" href="/?cadastrar=1">+ Novo restaurante</a>
</div>`;
                return;
            }

            if (usuario.role === "DONO") {
                box.innerHTML = `
<div class="panel-title"><h2>Seu restaurante</h2><span class="badge badge-live">Dono</span></div>
<p>Sua conta pode pedir comida e também vender no EasyFood.</p>
<div class="row">
    <a class="btn btn-neon" href="/painel.html">Abrir painel</a>
    <a class="btn" href="/?cadastrar=1">+ Novo restaurante</a>
</div>`;
                return;
            }

            box.innerHTML = `
<div class="panel-title"><h2>Venda no EasyFood</h2><span class="badge">Cliente</span></div>
<p>Tem um restaurante? Ative o modo restaurante para cadastrar o seu e receber pedidos. Você continua podendo pedir comida.</p>
<button class="btn btn-neon" onclick="virarDono()">Ativar modo restaurante</button>`;

        }

        async function virarDono() {

            if (!(await UI.confirmar("Ativar o modo restaurante na sua conta?", { confirmar: "Ativar" }))) return;

            try {
                usuario = await App.api("/auth/me/become-owner", { method: "POST", autenticado: true });
                App.salvarSessao(App.token(), usuario);
                UI.avisoNaProximaPagina("Modo restaurante ativado! Cadastre seu restaurante.");
                window.location.href = "/?cadastrar=1";
            } catch (erro) {
                UI.erro(erro);
            }

        }


        async function iniciar() {

            if (!App.exigirLogin()) return;

            usuario = await App.api("/auth/me", { autenticado: true });

            document.getElementById("conteudo").hidden = false;

            mostrarPerfil();
            await carregarEnderecos();

        }

        iniciar().catch(erro => UI.erro(erro));

    </script>

</body>

</html>
