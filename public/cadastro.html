<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Criar conta - EasyFood</title>
</head>

<body>

    <main class="auth">

        <section class="auth-art" aria-hidden="true">
            <div class="synth">
                <div class="synth-sun"></div>
                <div class="synth-floor"></div>
            </div>
            <a class="auth-brand" href="/">Easy<span>Food</span></a>
            <h2>Entre no circuito do sabor.</h2>
        </section>

        <section class="auth-form-side">

            <div class="auth-box">

                <span class="kicker">nova conta</span>
                <h1>Criar conta</h1>
                <p>Leva menos de um minuto.</p>

                <p id="mensagem" class="auth-message" hidden></p>

                <form id="formCadastro" class="stack">

                    <label class="field">
                        <span>Nome</span>
                        <input type="text" id="name" placeholder="Como quer ser chamado" minlength="2" maxlength="80" autocomplete="name" required>
                    </label>

                    <label class="field">
                        <span>E-mail</span>
                        <input type="email" id="email" placeholder="voce@email.com" autocomplete="email" required>
                    </label>

                    <label class="field">
                        <span>Senha</span>
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>
                    </label>

                    <fieldset>
                        <legend>Como você vai usar o EasyFood?</legend>
                        <div class="options">
                            <label><input type="radio" name="role" value="CLIENTE" checked> 🍔 Quero pedir comida</label>
                            <label><input type="radio" name="role" value="DONO"> 🏪 Tenho um restaurante</label>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn btn-neon btn-lg btn-block">Criar conta</button>

                </form>

                <p class="auth-alt">Já tem conta? <a href="login.html">Entrar</a></p>

            </div>

        </section>

    </main>

    <script src="/js/app.js"></script>

    <script>

        const mensagem = document.getElementById("mensagem");
        const destino = App.destinoSeguro(new URLSearchParams(window.location.search).get("voltar"));

        mensagem.classList.add("erro");

        document.getElementById("formCadastro").addEventListener("submit", async event => {

            event.preventDefault();

            const botao = event.target.querySelector("button");
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            botao.disabled = true;
            mensagem.hidden = true;

            try {

                await App.api("/auth/register", {
                    method: "POST",
                    body: {
                        name: document.getElementById("name").value,
                        email,
                        password,
                        role: document.querySelector("input[name=role]:checked").value
                    }
                });

                // Conta criada: já entra direto
                const sessao = await App.api("/auth/login", {
                    method: "POST",
                    body: { email, password }
                });

                App.salvarSessao(sessao.token, sessao.user);

                // Dono vai direto cadastrar o restaurante
                window.location.href = ["DONO", "ADMIN"].includes(sessao.user.role) && destino === "/"
                    ? "/?cadastrar=1"
                    : destino;

            } catch (erro) {

                mensagem.textContent = erro.message;
                mensagem.hidden = false;
                botao.disabled = false;

            }

        });

    </script>

</body>

</html>
