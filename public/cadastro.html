<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - EasyFood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                EasyFood<span>.</span>
            </div>

            <span class="auth-tag">COMECE AGORA</span>

            <h1>Criar conta</h1>

            <p class="auth-description">
                Crie sua conta e comece a pedir pelo EasyFood.
            </p>

            <p id="mensagem" class="auth-message erro" hidden></p>

            <form id="formCadastro">

                <div class="auth-field">
                    <label for="name">Nome</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Digite seu nome"
                        minlength="2"
                        maxlength="80"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Senha</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Crie uma senha (mínimo 6 caracteres)"
                        minlength="6"
                        required
                    >
                </div>

                <fieldset class="account-type">
                    <legend>Como você vai usar o EasyFood?</legend>

                    <label>
                        <input type="radio" name="role" value="CLIENTE" checked>
                        <span>🍔 Quero pedir comida</span>
                    </label>

                    <label>
                        <input type="radio" name="role" value="DONO">
                        <span>🏪 Tenho um restaurante</span>
                    </label>
                </fieldset>

                <button type="submit" class="auth-button">
                    Criar conta
                    <span>→</span>
                </button>

            </form>

            <p class="auth-register">
                Já tem uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </div>

    </main>



    <script src="/js/app.js"></script>

    <script>

        const mensagem = document.getElementById("mensagem");
        const destino = App.destinoSeguro(
            new URLSearchParams(window.location.search).get("voltar")
        );

        document.getElementById("formCadastro").addEventListener("submit", async function(event) {

            event.preventDefault();

            const botao = event.target.querySelector("button");
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            botao.disabled = true;
            mensagem.hidden = true;

            try {

                await App.api("/auth/register", {
                    method: "POST",
                    body: {
                        name: document.getElementById("name").value,
                        email,
                        password,
                        role: document.querySelector("input[name=role]:checked").value
                    }
                });

                // Conta criada: já entra direto, sem precisar digitar de novo
                const sessao = await App.api("/auth/login", {
                    method: "POST",
                    body: { email, password }
                });

                App.salvarSessao(sessao.token, sessao.user);

                // Dono vai direto para a página inicial cadastrar o restaurante
                window.location.href = sessao.user.role === "DONO" && destino === "/"
                    ? "/?cadastrar=1"
                    : destino;

            } catch (erro) {

                mensagem.textContent = erro.message;
                mensagem.hidden = false;

            } finally {

                botao.disabled = false;

            }

        });

    </script>

</body>

</html>
