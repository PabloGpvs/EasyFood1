<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - EasyFood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                EasyFood<span>.</span>
            </div>

            <span class="auth-tag">BEM-VINDO DE VOLTA</span>

            <h1>Entrar no EasyFood</h1>

            <p class="auth-description">
                Acesse sua conta e continue seu pedido.
            </p>

            <p id="mensagem" class="auth-message" hidden></p>

            <form id="formLogin">

                <div class="auth-field">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Senha</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <a class="auth-forgot" href="esqueci-senha.html">Esqueci minha senha</a>

                <button type="submit" class="auth-button">
                    Entrar
                    <span>→</span>
                </button>

            </form>

            <p class="auth-register">
                Ainda não tem conta?
                <a href="cadastro.html" id="linkCadastro">Criar conta</a>
            </p>

        </div>

    </main>



<script src="/js/app.js"></script>

<script>

const MENSAGENS = {
    expirou: "Sua sessão expirou. Entre novamente para continuar.",
    entrar: "Entre na sua conta para continuar.",
    cadastro: "Conta criada! Agora é só entrar.",
    senha: "Senha alterada! Entre com a nova senha."
};

const params = new URLSearchParams(window.location.search);
const destino = App.destinoSeguro(params.get("voltar"));
const mensagem = document.getElementById("mensagem");

if (MENSAGENS[params.get("motivo")]) {
    mensagem.textContent = MENSAGENS[params.get("motivo")];
    mensagem.hidden = false;
}

if (params.get("email")) {
    document.getElementById("email").value = params.get("email");
}

document.getElementById("formLogin").addEventListener("submit", async function(event) {

    event.preventDefault();

    const botao = event.target.querySelector("button");
    botao.disabled = true;

    try {

        const resultado = await App.api("/auth/login", {
            method: "POST",
            body: {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            }
        });

        App.salvarSessao(resultado.token, resultado.user);

        window.location.href = destino;

    } catch (erro) {

        mensagem.textContent = erro.message;
        mensagem.classList.add("erro");
        mensagem.hidden = false;

    } finally {

        botao.disabled = false;

    }

});

</script>

</body>

</html>
