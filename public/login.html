<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - EasyFood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                EasyFood<span>.</span>
            </div>

            <span class="auth-tag">BEM-VINDO DE VOLTA</span>

            <h1>Entrar no EasyFood</h1>

            <p class="auth-description">
                Acesse sua conta e continue seu pedido.
            </p>

            <form id="formLogin">

                <div class="auth-field">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Senha</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Entrar
                    <span>→</span>
                </button>

            </form>

            <p class="auth-register">
                Ainda não tem conta?
                <a href="cadastro.html">Criar conta</a>
            </p>

        </div>

    </main>

</body>

<script>

document.getElementById("formLogin").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const resposta = await fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    });

    const resultado = await resposta.json();

    if (resposta.ok) {

        localStorage.setItem("token", resultado.token);

        localStorage.setItem("usuario", JSON.stringify(resultado.user));

        alert("Login realizado com sucesso!");

        window.location.href = "/";

    } else {

        alert(resultado.error || "Erro ao realizar login.");

    }

});

</script>

</body>
</html>
