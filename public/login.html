<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Entrar - EasyFood</title>
</head>

<body>

    <main class="auth">

        <section class="auth-art" aria-hidden="true">
            <div class="synth">
                <div class="synth-sun"></div>
                <div class="synth-floor"></div>
            </div>
            <a class="auth-brand" href="/">Easy<span>Food</span></a>
            <h2>Sua fome, em tempo real.</h2>
        </section>

        <section class="auth-form-side">

            <div class="auth-box">

                <span class="kicker">acesso</span>
                <h1>Entrar</h1>
                <p>Entre na sua conta para pedir e acompanhar seus pedidos.</p>

                <p id="mensagem" class="auth-message" hidden></p>

                <form id="formLogin" class="stack">

                    <label class="field">
                        <span>E-mail</span>
                        <input type="email" id="email" placeholder="voce@email.com" autocomplete="email" required>
                    </label>

                    <label class="field">
                        <span>Senha</span>
                        <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" required>
                    </label>

                    <a class="auth-forgot" href="esqueci-senha.html">Esqueci minha senha</a>

                    <button type="submit" class="btn btn-neon btn-lg btn-block">Entrar</button>

                </form>

                <p class="auth-alt">Ainda não tem conta? <a href="cadastro.html" id="linkCadastro">Criar conta</a></p>

            </div>

        </section>

    </main>

    <script src="/js/app.js"></script>

    <script>

        const MENSAGENS = {
            expirou: "Sua sessão expirou. Entre novamente para continuar.",
            entrar: "Entre na sua conta para continuar.",
            senha: "Senha alterada. Entre com a nova senha."
        };

        const params = new URLSearchParams(window.location.search);
        const destino = App.destinoSeguro(params.get("voltar"));
        const mensagem = document.getElementById("mensagem");

        if (MENSAGENS[params.get("motivo")]) {
            mensagem.textContent = MENSAGENS[params.get("motivo")];
            mensagem.hidden = false;
        }

        // Leva o "voltar" junto para o cadastro
        if (params.get("voltar")) {
            document.getElementById("linkCadastro").href = `cadastro.html?voltar=${encodeURIComponent(destino)}`;
        }

        document.getElementById("formLogin").addEventListener("submit", async event => {

            event.preventDefault();

            const botao = event.target.querySelector("button");
            botao.disabled = true;

            try {

                const resultado = await App.api("/auth/login", {
                    method: "POST",
                    body: {
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value
                    }
                });

                App.salvarSessao(resultado.token, resultado.user);
                window.location.href = destino;

            } catch (erro) {

                mensagem.textContent = erro.message;
                mensagem.classList.add("erro");
                mensagem.hidden = false;
                botao.disabled = false;

            }

        });

    </script>

</body>

</html>
