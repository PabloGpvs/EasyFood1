<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus pedidos - EasyFood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="orders-header">

        <div>
            <span class="orders-tag">EASYFOOD • PEDIDOS</span>

            <h1>Meus pedidos</h1>

            <p>
                Acompanhe seus pedidos. O status atualiza sozinho.
            </p>
        </div>

        <button
            id="btnVoltar"
            onclick="window.location.href='/'"
        >
            ← Restaurantes
        </button>

    </header>

    <main>
        <p id="avisoNovo" class="order-success" hidden></p>

        <section id="pedidos">
            Carregando pedidos...
        </section>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/ui.js"></script>

    <script>

        const { escapar, preco } = App;

        const novoPedido = Number(
            new URLSearchParams(window.location.search).get("novo")
        );

        let ultimoConteudo = "";

        if (novoPedido) {
            const aviso = document.getElementById("avisoNovo");
            aviso.textContent = `✅ Pedido #${novoPedido} enviado! Acompanhe o andamento abaixo.`;
            aviso.hidden = false;
        }

        function cartaoPedido(pedido) {

            const restaurante = pedido.restaurant || pedido.items[0]?.dish.restaurant;

            return `
<div class="pedido-card ${pedido.id === novoPedido ? "pedido-destaque" : ""}">

    <div class="order-card-header">

        <div>
            <span class="order-tag">
                PEDIDO • ${escapar(App.data(pedido.createdAt))}
            </span>
            <h2>#${pedido.id}${restaurante ? ` · ${escapar(restaurante.name)}` : ""}</h2>
        </div>

        <strong class="status ${pedido.status.toLowerCase()}">
            ${App.statusTexto(pedido.status)}
        </strong>

    </div>

    <div class="order-products">

        <span class="order-section-title">PRODUTOS</span>

        ${pedido.items.map(item => `
            <div class="order-product">

                <div>
                    <h3>${escapar(item.dish.name)}</h3>
                    <span>Quantidade: ${item.quantity} × ${preco(item.price)}</span>
                </div>

                <strong>${preco(item.price * item.quantity)}</strong>

            </div>
        `).join("")}

    </div>

    <div class="order-details">
        ${pedido.address ? `<span>📍 ${escapar(pedido.address)}</span>` : ""}
        ${pedido.note ? `<span>📝 ${escapar(pedido.note)}</span>` : ""}
        <span>💳 ${App.pagamentoTexto(pedido.paymentMethod)}${pedido.changeFor ? ` · troco para ${preco(pedido.changeFor)}` : ""}</span>
        ${pedido.deliveryFee > 0 ? `<span>🛵 Taxa de entrega ${preco(pedido.deliveryFee)}</span>` : ""}
    </div>

    <div class="order-total">
        <span>Total do pedido</span>
        <strong>${preco(pedido.total)}</strong>
    </div>

    ${blocoAvaliacao(pedido)}

    ${pedido.status === "PENDENTE" ? `
    <button class="order-cancel" onclick="cancelarPedido(${pedido.id})">
        Cancelar pedido
    </button>` : ""}

</div>`;

        }

        function blocoAvaliacao(pedido) {

            if (pedido.review) {
                return `
    <div class="order-review done">
        <span>Sua avaliação</span>
        <strong class="review-stars">${App.estrelas(pedido.review.rating)}</strong>
        ${pedido.review.comment ? `<p>${escapar(pedido.review.comment)}</p>` : ""}
    </div>`;
            }

            if (pedido.status !== "ENTREGUE") {
                return "";
            }

            return `
    <form class="order-review" onsubmit="avaliar(event, ${pedido.id})">
        <span>Como foi o pedido?</span>
        <div class="star-input">
            ${[5, 4, 3, 2, 1].map(n => `
            <input type="radio" id="nota-${pedido.id}-${n}" name="nota" value="${n}" required>
            <label for="nota-${pedido.id}-${n}" title="${n} estrela${n > 1 ? "s" : ""}">★</label>`).join("")}
        </div>
        <textarea name="comentario" maxlength="300" placeholder="Conte o que achou (opcional)"></textarea>
        <button type="submit" class="btn-photo">Enviar avaliação</button>
    </form>`;

        }

        async function avaliar(evento, id) {

            evento.preventDefault();

            const form = evento.target;

            try {
                await App.api(`/orders/${id}/review`, {
                    method: "POST",
                    autenticado: true,
                    body: {
                        rating: Number(form.elements["nota"].value),
                        comment: form.elements["comentario"].value
                    }
                });
                UI.sucesso("Obrigado pela avaliação!");
                document.activeElement?.blur();
                await carregarPedidos();
            } catch (erro) {
                UI.erro(erro);
            }

        }

        async function carregarPedidos() {

            const container = document.getElementById("pedidos");

            try {

                const pedidos = await App.api("/orders", { autenticado: true });

                const html = pedidos.length === 0
                    ? `<p class="empty-state">Você ainda não fez pedidos. <a href="/">Escolher um restaurante</a></p>`
                    : pedidos.map(cartaoPedido).join("");

                // Só redesenha se algo mudou (evita a tela "piscar") e se a pessoa
                // não estiver digitando uma avaliação
                const digitando = container.contains(document.activeElement) &&
                    ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName);

                if (html !== ultimoConteudo && !digitando) {
                    container.innerHTML = html;
                    ultimoConteudo = html;
                }

            } catch (erro) {

                container.innerHTML =
                    `<p class="empty-state">${escapar(erro.message)}</p>`;
                ultimoConteudo = "";

            }

        }

        async function cancelarPedido(id) {

            if (!(await UI.confirmar(`Cancelar o pedido #${id}?`, { confirmar: "Cancelar pedido", perigo: true }))) {
                return;
            }

            try {
                await App.api(`/orders/${id}/cancel`, { method: "PATCH", autenticado: true });
            } catch (erro) {
                UI.erro(erro);
            }

            carregarPedidos();

        }

        if (App.exigirLogin()) {

            carregarPedidos();

            // Tempo real: o servidor avisa quando o restaurante muda o status
            App.ouvirPedidos(({ type, order }) => {
                if (type === "status") {
                    UI.info(`Pedido #${order.id}: ${App.statusTexto(order.status)}`);
                }
                carregarPedidos();
            });

            // Garantia, caso a conexão em tempo real caia
            setInterval(carregarPedidos, 30000);

        }

    </script>

</body>

</html>
