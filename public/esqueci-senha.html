<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Esqueci minha senha - EasyFood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                EasyFood<span>.</span>
            </div>

            <span class="auth-tag">RECUPERAR ACESSO</span>

            <h1>Esqueci minha senha</h1>

            <p class="auth-description">
                Informe o e-mail da sua conta. Vamos enviar um link para você criar uma nova senha.
            </p>

            <p id="mensagem" class="auth-message" hidden></p>

            <form id="formEsqueci">

                <div class="auth-field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <button type="submit" class="auth-button">
                    Enviar link
                    <span>→</span>
                </button>

            </form>

            <p class="auth-register">
                Lembrou a senha?
                <a href="login.html">Entrar</a>
            </p>

        </div>

    </main>

    <script src="/js/app.js"></script>

    <script>

        const mensagem = document.getElementById("mensagem");

        document.getElementById("formEsqueci").addEventListener("submit", async event => {

            event.preventDefault();

            const botao = event.target.querySelector("button");
            botao.disabled = true;

            try {

                const resposta = await App.api("/auth/forgot-password", {
                    method: "POST",
                    body: { email: document.getElementById("email").value }
                });

                mensagem.textContent = resposta.message;
                mensagem.classList.remove("erro");

            } catch (erro) {

                mensagem.textContent = erro.message;
                mensagem.classList.add("erro");

            } finally {

                mensagem.hidden = false;
                botao.disabled = false;

            }

        });

    </script>

</body>

</html>
