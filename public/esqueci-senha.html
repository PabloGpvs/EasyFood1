<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Esqueci minha senha - EasyFood</title>
</head>

<body>

    <main class="auth">

        <section class="auth-art" aria-hidden="true">
            <div class="synth">
                <div class="synth-sun"></div>
                <div class="synth-floor"></div>
            </div>
            <a class="auth-brand" href="/">Easy<span>Food</span></a>
            <h2>Acesso perdido? A gente reconecta.</h2>
        </section>

        <section class="auth-form-side">

            <div class="auth-box">

                <span class="kicker">recuperar acesso</span>
                <h1>Esqueci minha senha</h1>
                <p>Informe o e-mail da conta. Enviamos um link para você criar uma nova senha.</p>

                <p id="mensagem" class="auth-message" hidden></p>

                <form id="formEsqueci" class="stack">

                    <label class="field">
                        <span>E-mail</span>
                        <input type="email" id="email" placeholder="voce@email.com" autocomplete="email" required>
                    </label>

                    <button type="submit" class="btn btn-neon btn-lg btn-block">Enviar link</button>

                </form>

                <p class="auth-alt">Lembrou a senha? <a href="login.html">Entrar</a></p>

            </div>

        </section>

    </main>

    <script src="/js/app.js"></script>

    <script>

        const mensagem = document.getElementById("mensagem");

        document.getElementById("formEsqueci").addEventListener("submit", async event => {

            event.preventDefault();

            const botao = event.target.querySelector("button");
            botao.disabled = true;

            try {

                const resposta = await App.api("/auth/forgot-password", {
                    method: "POST",
                    body: { email: document.getElementById("email").value }
                });

                mensagem.textContent = resposta.message;
                mensagem.classList.remove("erro");

            } catch (erro) {

                mensagem.textContent = erro.message;
                mensagem.classList.add("erro");

            } finally {

                mensagem.hidden = false;
                botao.disabled = false;

            }

        });

    </script>

</body>

</html>
